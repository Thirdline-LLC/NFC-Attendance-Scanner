# electron-builder — direct macOS distribution, no Mac App Store.
#
# A packaging run must happen ON macOS: only there can electron-builder make an
# .icns or sign anything. Everything in this file is checked into the repo;
# nothing secret belongs here.
#
# THE DEFAULT BUILD IS AD-HOC SIGNED AND NEEDS NO APPLE DEVELOPER ACCOUNT.
# See `mac.identity` below for why it is signed at all rather than left bare.
# The Developer ID + notarization route is deferred; when you want it, see
# docs/desktop-macos.md and the note in docs/deferred-apple-developer.md.

appId: org.stjohnschs.attendance
# The same reverse-domain identity the Android app and the iOS project already
# ship. It is what macOS keys the app's identity, its keychain entries and its
# quarantine assessment to. IT MUST NOT CHANGE BETWEEN RELEASES.
productName: SJC Attendance
copyright: © St John's Catholic School

directories:
  output: dist/desktop
  buildResources: electron/resources

# Only the two built directories and the manifest Electron reads `main` from.
# node_modules is excluded outright: every runtime dependency is already
# bundled into dist/public by Vite, and a pnpm workspace's symlinked tree is
# not something to hand to a packager.
files:
  - dist/electron/**/*
  - dist/public/**/*
  - package.json
  - '!node_modules/**/*'

asar: true

# No electron-updater feed. `publish: null` stays. A teacher-initiated check
# reads public GitHub Releases and, on macOS, replaces the installed .app in
# place. That path is our own code (`@workspace/update`), not an update feed.
publish: null

mac:
  category: public.app-category.education
  icon: electron/resources/icon.png
  # No `arch` here on purpose: electron-builder then builds for the machine
  # doing the building, which is the fast path and the one you want first.
  # The package.json scripts add --arm64/--x64/--universal when you actually
  # need to hand the app to a Mac of a different kind.
  target:
    - dmg
    # `dir` produces the bare .app, which is what you want while developing.
    - dir
  # Ad-hoc ("-"), NOT unsigned, and this matters:
  #
  #   * On Apple Silicon macOS refuses to launch a binary carrying no
  #     signature at all — the app dies before it draws a window, usually
  #     reported to the user as "the application is damaged".
  #   * An ad-hoc signature satisfies that requirement without an Apple
  #     Developer account. It asserts no identity, so Gatekeeper still
  #     quarantines a copy that arrived from another machine — see
  #     docs/desktop-macos.md for the one command a recipient runs.
  #
  # Replace this with a Developer ID identity when you take that route; the
  # entitlements file already carries what notarization needs.
  identity: "-"
  # Kept ON under the ad-hoc signature rather than switched off. That costs one
  # extra entitlement (disable-library-validation, see the plist) and keeps
  # every other hardened-runtime protection in place.
  hardenedRuntime: true
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  # An ad-hoc signature cannot pass Gatekeeper assessment, and a failed
  # assessment would abort the build for no reason.
  gatekeeperAssess: false
  # Deferred. Notarization needs a paid Apple Developer account; nothing here
  # waits on Apple.
  notarize: false
  # The app asks for no camera, microphone, location or contacts, so it
  # declares no usage descriptions. Adding one would make macOS prompt a
  # teacher for something this app never does.
  extendInfo:
    LSApplicationCategoryType: public.app-category.education
    # A kiosk is portrait-ish but resizable; no orientation lock exists on
    # macOS. Stated here only to keep the Info.plist explicit.
    NSHighResolutionCapable: true

dmg:
  title: ${productName}
  # The two-icon layout everyone recognises: drag the app onto Applications.
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
